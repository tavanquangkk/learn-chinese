# --- 本番環境設定 (PostgreSQL と H2 へのフォールバック) ---

# ロジック説明:
# 1. 環境変数 (DB_URL 等) が設定されている場合は PostgreSQL を使用します。
# 2. 環境変数が設定されていない場合, コロン(:)以降のデフォルト値 (H2) を自動的に使用します。

# データベース接続
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/learnchinesedb_prod;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA 方言の設定 (PostgreSQL 用。環境変数がなければ H2 用)
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# テーブルの自動更新 (本番環境では注意が必要ですが, 現在は update に設定)
spring.jpa.hibernate.ddl-auto=update
# 本番環境では SQL ログを非表示にする
spring.jpa.show-sql=false
