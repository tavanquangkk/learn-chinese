server.port=8080

# --- Database Configuration (Environment Variables) ---
# Default: H2 File Database (for Local Dev)
# To switch to Postgres, set these ENV variables:
# DB_URL=jdbc:postgresql://localhost:5432/learnchinesedb
# DB_USERNAME=postgres
# DB_PASSWORD=password
# DB_DRIVER=org.postgresql.Driver

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/learnchinesedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Gemini API ---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent