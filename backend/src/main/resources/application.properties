spring.application.name=learn-chinese-backend
server.port=8080

# --- プロファイル設定 ---
# 環境変数 APP_PROFILE が設定されていない場合はデフォルトで 'dev' を使用します
spring.profiles.active=${APP_PROFILE:dev}

# --- Gemini API 設定 (開発・本番共通) ---
# Google Gemini API キー
gemini.api.key=${GEMINI_API_KEY:khongcodaumalay}
# Gemini API エンドポイント (1.5 Flash モデル)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent