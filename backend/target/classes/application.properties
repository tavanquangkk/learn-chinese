spring.application.name=learn-chinese-backend
server.port=8080

# --- プロファイル設定 ---
# 環境変数 APP_PROFILE が設定されていない場合はデフォルトで 'dev' を使用します
spring.profiles.active=${APP_PROFILE:dev}

# --- AI API 設定 (開発・本番共通) ---

# API key
ai.api.key=${AI_API_KEY:modaymahup}

# API URL
ai.api.url=${AI_API_URL:https://openrouter.ai/api/v1/chat/completions}

# Model
ai.api.model=${AI_API_MODEL:xiaomi/mimo-v2-flash:free}
